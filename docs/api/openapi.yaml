          - type: 'null'
          title: Approved Term Months
        interest_rate:
          anyOf:
          - type: number
            maximum: 100.0
            exclusiveMinimum: 0.0
          - type: string
          - type: 'null'
          title: Interest Rate
        conditions:
          items:
            $ref: '#/components/schemas/OfferCondition'
          type: array
          title: Conditions
          default: []
        reasons:
          items:
            $ref: '#/components/schemas/DecisionReason'
          type: array
          title: Reasons
          default: []
        more_info_target:
          anyOf:
          - $ref: '#/components/schemas/MoreInfoTarget'
          - type: 'null'
        info_request:
          anyOf:
          - $ref: '#/components/schemas/InfoRequestCreate'
          - type: 'null'
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Comment
      type: object
      required:
      - decision_type
      title: UnderwriterDecisionRequest
      description: |-
        approved/conditional_approval требуют условий оффера.
        conditional_approval - контр-предложение: изменены сумма, срок, ставка или обеспечение.
        more_information_required требует more_info_target: client - с info_request (запрос
        документов формирует ИИ-агент), credit_analyst - с comment (что проверить аналитику).
        alternative_offer (только для conditional_approval) берёт сумму, срок и ставку из
        варианта в AI Credit Memo; явно переданные поля имеют приоритет.
    UserCompany:
      properties:
        company_id:
          type: string
          format: uuid
          title: Company Id
        company_name:
          type: string
          title: Company Name
        role:
          $ref: '#/components/schemas/CompanyMemberRole'
      type: object
      required:
      - company_id
      - company_name
      - role
      title: UserCompany
    UserRole:
      type: string
      enum:
      - client
      - credit_analyst
      - underwriter
      - admin
      title: UserRole
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: JWT из POST /api/v1/auth/login
      scheme: bearer
