openapi: 3.1.0
info:
  title: Smart Credit Office API
  description: |-
    Умный кредитный кабинет предпринимателя (Альфа-Хак 2026): кредитный конвейер для МСБ
    от заявки до выдачи.

    Авторизация: `Authorization: Bearer <JWT>`. Клиент получает токен через
    `POST /api/v1/auth/login/phone`, сотрудник банка - через `POST /api/v1/auth/login`.
    Демо-учётки - в README репозитория.

    Деньги - строкой (`"1500000.00"`), даты - ISO 8601. Ошибки - `{"detail": "..."}`:
    404 - объекта нет или нет доступа, 409 - действие недопустимо в текущем статусе,
    422 - данные не проходят правила.
  version: 1.0.0
paths:
  /api/v1/health/live:
    get:
      tags:
      - health
      summary: Live
      operationId: live_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Live Api V1 Health Live Get
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: Ready
      operationId: ready_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready Api V1 Health Ready Get
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: |-
        Вход сотрудника банка (кредитный аналитик, андеррайтер) по логину и паролю.
        Учётные записи заведены заранее, регистрации нет. Клиенты входят по телефону.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login/phone:
    post:
      tags:
      - auth
      summary: Login By Phone
      description: |-
        Упрощённый вход клиента по номеру телефона, без пароля и SMS: по условиям кейса
        пользователь уже клиент банка. Демо-номера - в README.
      operationId: login_by_phone_api_v1_auth_login_phone_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Клиент с таким номером не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me:
    get:
      tags:
      - auth
      summary: Me
      description: Текущий пользователь и компании, от имени которых он действует.
      operationId: me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserRead'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/products:
    get:
      tags:
      - products
      summary: List Products
      description: Каталог активных кредитных продуктов.
      operationId: list_products_api_v1_products_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductRead'
                type: array
                title: Response List Products Api V1 Products Get
  /api/v1/products/{product_id}:
    get:
      tags:
      - products
      summary: Get Product
      operationId: get_product_api_v1_products__product_id__get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRead'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/products/match:
    post:
      tags:
      - products
      summary: Match Products
      description: |-
        Подбор продуктов под потребность: подходящие первыми, с пояснениями и примерным платежом
        (аннуитет по базовой ставке на условиях, ближайших к запрошенным в рамках продукта).
      operationId: match_products_api_v1_products_match_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductMatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductMatch'
                type: array
                title: Response Match Products Api V1 Products Match Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/companies/lookup:
    get:
      tags:
      - companies
      summary: Lookup Company
      description: |-
        Предзаполнение реквизитов, руководителя и учредителей по ИНН из (мока) ЕГРЮЛ/ЕГРИП.
        Демо-ИНН со сценариями - в docs/external-sources.md.
      operationId: lookup_company_api_v1_companies_lookup_get
      security:
      - HTTPBearer: []
      parameters:
      - name: inn
        in: query
        required: true
        schema:
          type: string
          pattern: ^(\d{10}|\d{12})$
          examples:
          - '7712345678'
          title: Inn
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRequisites'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/companies:
    get:
      tags:
      - companies
      summary: List My Companies
      description: Компании, от имени которых действует пользователь, с ролью в каждой.
      operationId: list_my_companies_api_v1_companies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompanyRead'
                type: array
                title: Response List My Companies Api V1 Companies Get
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - companies
      summary: Create Company
      description: |-
        Привязать компанию к пользователю. Реквизиты берутся из реестра, а не из запроса.
        Компания, уже обслуживаемая в банке, повторно не привязывается (409).
      operationId: create_company_api_v1_companies_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRead'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Действие недопустимо в текущем статусе заявки или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/companies/{company_id}:
    get:
      tags:
      - companies
      summary: Get Company
      description: |-
        Профиль компании: организация, деятельность, руководитель и владельцы, право подписи,
        контакты и расчётный счёт. Чужая компания - 404.
      operationId: get_company_api_v1_companies__company_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Company Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRead'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications:
    post:
      tags:
      - applications
      summary: Create Application
      description: |-
        Создать черновик заявки. У компании одна заявка в работе: пока есть незавершённая
        (не completed и не closed) - 409.
      operationId: create_application_api_v1_applications_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRead'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Действие недопустимо в текущем статусе заявки или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - applications
      summary: List Applications
      description: Заявки компаний пользователя, новые первыми.
      operationId: list_applications_api_v1_applications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/ApplicationStatus'
          - type: 'null'
          title: Status
      - name: company_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Company Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApplicationShort_'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}:
    get:
      tags:
      - applications
      summary: Get Application
      description: Заявка с понятным описанием этапа и списком доступных действий.
      operationId: get_application_api_v1_applications__application_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRead'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - applications
      summary: Update Application
      description: |-
        Изменить черновик или дополнить данные по дозапросу.
        Сумма, срок, цель и продукт меняются только до подачи (draft, pre_approved),
        финансовые показатели и залог - ещё и в need_additional_data.
      operationId: update_application_api_v1_applications__application_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRead'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Действие недопустимо в текущем статусе заявки или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}/consents:
    post:
      tags:
      - applications
      summary: Give Consents
      description: |-
        Дать согласия на получение данных (БКИ, ФНС, цифровой профиль), нужны все три.
        draft -> data_collection: ИИ собирает данные и рассчитывает предварительный лимит.
      operationId: give_consents_api_v1_applications__application_id__consents_post
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRead'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Действие недопустимо в текущем статусе заявки или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - applications
      summary: List Consents
      operationId: list_consents_api_v1_applications__application_id__consents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentRead'
                title: Response List Consents Api V1 Applications  Application Id  Consents Get
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}/pre-approval:
    get:
      tags:
      - applications
      summary: Get Pre Approval
      description: |-
        Вероятность одобрения, диапазон суммы, прогнозируемая ставка,
        необходимость обеспечения и рекомендации.
      operationId: get_pre_approval_api_v1_applications__application_id__pre_approval_get
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreApprovalRead'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}/pre-approval/decline:
    post:
      tags:
      - applications
      summary: Decline Pre Approval
      description: |-
        Клиент не продолжает после предварительного расчёта: pre_approved -> closed
        (close_reason = pre_approval_declined).
      operationId: decline_pre_approval_api_v1_applications__application_id__pre_approval_decline_post
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRead'
        '401':
          description: Нет или невалидный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Действие недопустимо в текущем статусе заявки или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}/cancel:
    post:
      tags:
      - applications
      summary: Cancel Application
